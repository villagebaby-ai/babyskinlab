<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 하루 띠 -->
  <rect x="120" y="372" width="960" height="40" rx="20" fill="#e6f7f7"/>
  <rect x="150" y="372" width="264" height="40" fill="#fef3c7"/>
  <rect x="120" y="372" width="960" height="40" rx="20" fill="none" stroke="#cbd5e1" stroke-width="4"/>

  <!-- 구간 노드 -->
  <g fill="#ffffff" stroke="#0ea5a4" stroke-width="6">
    <circle cx="280" cy="392" r="36"/>
    <circle cx="600" cy="392" r="36"/>
    <circle cx="920" cy="392" r="36"/>
  </g>
  <g fill="#0ea5a4">
    <circle cx="280" cy="392" r="15"/>
    <circle cx="600" cy="392" r="15"/>
    <circle cx="920" cy="392" r="15"/>
  </g>

  <!-- 연결선 -->
  <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
    <line x1="280" y1="272" x2="280" y2="350"/>
    <line x1="600" y1="272" x2="600" y2="350"/>
    <line x1="920" y1="272" x2="920" y2="350"/>
    <line x1="280" y1="434" x2="280" y2="470"/>
    <line x1="600" y1="434" x2="600" y2="470"/>
    <line x1="920" y1="434" x2="920" y2="470"/>
  </g>

  <!-- 행동 카드 -->
  <g fill="#ffffff" stroke="#0ea5a4" stroke-width="6">
    <rect x="140" y="470" width="280" height="106" rx="20"/>
    <rect x="460" y="470" width="280" height="106" rx="20"/>
    <rect x="780" y="470" width="280" height="106" rx="20"/>
  </g>

  <text x="280" y="252" text-anchor="middle" font-size="64" font-weight="800" fill="#0b8483">11–15시</text>
  <text x="600" y="252" text-anchor="middle" font-size="64" font-weight="800" fill="#0b8483">땀 직후</text>
  <text x="920" y="252" text-anchor="middle" font-size="64" font-weight="800" fill="#0b8483">저녁</text>

  <text x="280" y="541" text-anchor="middle" font-size="52" font-weight="700" fill="#0f172a">실내 놀이</text>
  <text x="600" y="541" text-anchor="middle" font-size="52" font-weight="700" fill="#0f172a">갈아입기</text>
  <text x="920" y="541" text-anchor="middle" font-size="52" font-weight="700" fill="#0f172a">목욕·보습</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
