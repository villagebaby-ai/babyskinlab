  <!-- 결과 띠 -->
  <rect x="80" y="600" width="640" height="120" rx="26" fill="#0ea5a4"/>
  <text x="400" y="678" text-anchor="middle" font-size="60" font-weight="800" fill="#ffffff">통목욕 시작</text>

  <!-- 예외 띠 -->
  <rect x="760" y="600" width="360" height="120" rx="26" fill="#ffffff" stroke="#ef4444" stroke-width="6"/>
  <text x="940" y="660" text-anchor="middle" font-size="42" font-weight="700" fill="#64748b">냄새·발열</text>
  <text x="940" y="706" text-anchor="middle" font-size="48" font-weight="800" fill="#ef4444">진료</text>

