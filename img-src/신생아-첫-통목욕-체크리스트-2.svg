<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 체크 카드 3장 -->
  <rect x="80" y="90" width="320" height="380" rx="28" fill="#e6f7f7"/>
  <g fill="none" stroke="#0b8483" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 250 l40 42 l82 -96"/>
  </g>
  <text x="240" y="392" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">마름</text>

  <rect x="440" y="90" width="320" height="380" rx="28" fill="#e6f7f7"/>
  <g fill="none" stroke="#0b8483" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M540 250 l40 42 l82 -96"/>
  </g>
  <text x="600" y="392" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">진물 없음</text>

  <rect x="800" y="90" width="320" height="380" rx="28" fill="#e6f7f7"/>
  <g fill="none" stroke="#0b8483" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900 250 l40 42 l82 -96"/>
