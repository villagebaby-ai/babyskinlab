  <text x="960" y="392" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">붉기 없음</text>

  <!-- 통과 화살표 -->
  <g fill="none" stroke="#0ea5a4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="600" y1="510" x2="600" y2="570"/>
    <path d="M572 546 l28 28 l28 -28"/>
