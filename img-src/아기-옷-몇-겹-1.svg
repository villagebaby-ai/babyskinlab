<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 어른 실루엣 (기준) -->
  <g fill="none" stroke="#0b8483" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="320" cy="152" r="56"/>
    <rect x="244" y="234" width="152" height="226" rx="56"/>
  </g>

  <!-- 어른 레이어 밴드 1겹 -->
  <rect x="180" y="520" width="280" height="58" rx="16" fill="#e6f7f7" stroke="#0b8483" stroke-width="6"/>
  <text x="320" y="674" text-anchor="middle" font-size="54" font-weight="700" fill="#0f172a">어른 기준</text>

  <!-- 화살표 -->
  <g fill="none" stroke="#0ea5a4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
