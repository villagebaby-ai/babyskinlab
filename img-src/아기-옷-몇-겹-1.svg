    <path d="M612 523 l30 26 l-30 26"/>
  </g>

  <!-- 아기 실루엣 -->
  <g fill="none" stroke="#0b8483" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="830" cy="216" r="40"/>
    <rect x="786" y="276" width="88" height="132" rx="44"/>
  </g>

  <!-- 아기 레이어 밴드 2겹 (위쪽이 추가된 한 겹) -->
  <rect x="690" y="440" width="280" height="58" rx="16" fill="#0ea5a4"/>
  <rect x="690" y="520" width="280" height="58" rx="16" fill="#e6f7f7" stroke="#0b8483" stroke-width="6"/>
  <text x="830" y="686" text-anchor="middle" font-size="72" font-weight="800" fill="#0b8483">+1겹까지</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
