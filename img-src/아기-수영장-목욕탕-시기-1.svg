<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 타임라인 축 -->
  <line x1="100" y1="420" x2="1100" y2="420" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

  <!-- 정점 1: 신생아 -->
  <circle cx="180" cy="420" r="26" fill="#0ea5a4"/>
  <text x="180" y="330" text-anchor="middle" font-size="42" font-weight="700" fill="#0f172a">집 물놀이</text>
  <text x="180" y="500" text-anchor="middle" font-size="54" font-weight="800" fill="#0b8483">신생아</text>

  <!-- 정점 2: 6개월 -->
  <circle cx="560" cy="420" r="26" fill="#0ea5a4"/>
  <text x="560" y="330" text-anchor="middle" font-size="42" font-weight="700" fill="#0f172a">공용 수영장</text>
  <text x="560" y="500" text-anchor="middle" font-size="54" font-weight="800" fill="#0b8483">6개월</text>

  <!-- 정점 3: 12개월 -->
  <circle cx="920" cy="420" r="26" fill="#0ea5a4"/>
  <text x="920" y="330" text-anchor="middle" font-size="42" font-weight="700" fill="#0f172a">수영 강습</text>
  <text x="920" y="500" text-anchor="middle" font-size="54" font-weight="800" fill="#0b8483">12개월</text>

  <!-- 화살표 진행 -->
  <path d="M1085 420 l-25 -16 v32 Z" fill="#cbd5e1"/>

  <!-- 온탕·찜질방 경고 배지 (타임라인 아래, 전 구간 비권장) -->
  <rect x="100" y="600" width="1000" height="120" rx="24" fill="#fef3c7"/>
  <text x="600" y="650" text-anchor="middle" font-size="42" font-weight="700" fill="#0f172a">목욕탕 온탕·찜질방 고온실</text>
  <text x="600" y="700" text-anchor="middle" font-size="46" font-weight="800" fill="#ef4444">전 시기 비권장</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
