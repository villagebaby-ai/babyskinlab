<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 구간 띠: 스펀지 목욕 → 통목욕 -->
  <rect x="90" y="330" width="640" height="120" rx="24" fill="#fef3c7"/>
  <rect x="760" y="330" width="350" height="120" rx="24" fill="#e6f7f7"/>

  <text x="410" y="408" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">스펀지 목욕</text>
  <text x="935" y="408" text-anchor="middle" font-size="54" font-weight="800" fill="#0b8483">통목욕</text>

  <!-- 타임라인 축 -->
  <line x1="90" y1="530" x2="1110" y2="530" stroke="#0ea5a4" stroke-width="6" stroke-linecap="round"/>

  <!-- 마디 -->
  <circle cx="150" cy="530" r="20" fill="#0ea5a4"/>
  <circle cx="440" cy="530" r="20" fill="#0ea5a4"/>
  <circle cx="745" cy="530" r="28" fill="#0b8483"/>
  <circle cx="1050" cy="530" r="20" fill="#0ea5a4"/>

  <!-- 그루터기 마름 표현 (축 위 작은 도형) -->
  <rect x="132" y="228" width="36" height="76" rx="16" fill="#fef3c7" stroke="#0b8483" stroke-width="6"/>
  <rect x="422" y="248" width="36" height="56" rx="16" fill="#0b8483"/>
  <circle cx="745" cy="276" r="30" fill="none" stroke="#0b8483" stroke-width="6" stroke-dasharray="14 16"/>
  <circle cx="1050" cy="276" r="26" fill="#e6f7f7" stroke="#0ea5a4" stroke-width="6"/>

  <!-- 라벨 -->
  <text x="150" y="620" text-anchor="middle" font-size="44" font-weight="700" fill="#64748b">출생</text>
  <text x="440" y="620" text-anchor="middle" font-size="44" font-weight="700" fill="#64748b">마름</text>
  <text x="745" y="628" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">탈락</text>
  <text x="745" y="692" text-anchor="middle" font-size="44" font-weight="700" fill="#0b8483">1–3주</text>
  <text x="1050" y="620" text-anchor="middle" font-size="44" font-weight="700" fill="#64748b">아묾</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
