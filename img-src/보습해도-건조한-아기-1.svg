<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 상단: 빠져나가는 수분 -->
  <text x="640" y="150" text-anchor="middle" font-size="66" font-weight="800" fill="#0b8483">수분 증발</text>

  <!-- 증발 화살표 (보습막 틈에서 위로) -->
  <g stroke="#0ea5a4" stroke-width="9" stroke-linecap="round" fill="#0ea5a4">
    <path d="M585 385 L585 255" fill="none"/>
    <polygon points="585,218 608,262 562,262"/>
    <path d="M865 385 L865 255" fill="none"/>
    <polygon points="865,218 888,262 842,262"/>
  </g>
  <g fill="#0ea5a4" opacity="0.45">
    <circle cx="510" cy="320" r="17"/>
    <circle cx="672" cy="290" r="13"/>
    <circle cx="948" cy="325" r="15"/>
  </g>

  <!-- 보습막 (끊긴 띠) -->
  <g fill="#0ea5a4">
    <rect x="300" y="400" width="250" height="36" rx="18"/>
    <rect x="620" y="400" width="210" height="36" rx="18"/>
    <rect x="900" y="400" width="160" height="36" rx="18"/>
  </g>

  <!-- 각질층 (벽돌) -->
  <g fill="#ffffff" stroke="#0ea5a4" stroke-width="5">
    <rect x="305" y="462" width="118" height="60" rx="10"/>
    <rect x="431" y="462" width="118" height="60" rx="10"/>
    <rect x="557" y="462" width="118" height="60" rx="10"/>
    <rect x="683" y="462" width="118" height="60" rx="10"/>
    <rect x="809" y="462" width="118" height="60" rx="10"/>
    <rect x="935" y="462" width="118" height="60" rx="10"/>
  </g>

  <!-- 속 피부 + 남은 수분 -->
  <rect x="300" y="548" width="760" height="160" rx="26" fill="#e6f7f7" stroke="#0ea5a4" stroke-width="5"/>
  <g fill="#0ea5a4" opacity="0.5">
    <circle cx="420" cy="628" r="20"/>
    <circle cx="560" cy="640" r="16"/>
    <circle cx="700" cy="620" r="19"/>
    <circle cx="840" cy="642" r="15"/>
    <circle cx="960" cy="626" r="18"/>
  </g>

  <!-- 라벨 -->
  <text x="272" y="432" text-anchor="end" font-size="46" font-weight="700" fill="#0f172a">보습막</text>
  <text x="272" y="508" text-anchor="end" font-size="46" font-weight="700" fill="#64748b">각질층</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
