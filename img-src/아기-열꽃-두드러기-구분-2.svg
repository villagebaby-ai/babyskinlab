<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 연결 화살표 (질문 → 다음 질문) -->
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="330" y1="270" x2="330" y2="315"/>
    <line x1="330" y1="500" x2="330" y2="545"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="330,332 314,302 346,302"/>
    <polygon points="330,562 314,532 346,532"/>
  </g>

  <!-- 1행: 열이 먼저였나 → 열꽃 -->
  <rect x="60" y="100" width="540" height="170" rx="26" fill="#e6f7f7" stroke="#0ea5a4" stroke-width="6"/>
  <text x="330" y="205" text-anchor="middle" font-size="52" font-weight="800" fill="#0b8483">열이 먼저?</text>
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none"><line x1="620" y1="185" x2="690" y2="185"/></g>
  <polygon points="712,185 682,169 682,201" fill="#94a3b8"/>
  <rect x="730" y="100" width="410" height="170" rx="26" fill="#ffffff" stroke="#0ea5a4" stroke-width="6"/>
  <text x="935" y="205" text-anchor="middle" font-size="56" font-weight="800" fill="#0f172a">열꽃</text>

  <!-- 2행: 자리를 옮기나 → 두드러기 -->
  <rect x="60" y="330" width="540" height="170" rx="26" fill="#e6f7f7" stroke="#0ea5a4" stroke-width="6"/>
  <text x="330" y="435" text-anchor="middle" font-size="52" font-weight="800" fill="#0b8483">자리 옮김?</text>
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none"><line x1="620" y1="415" x2="690" y2="415"/></g>
  <polygon points="712,415 682,399 682,431" fill="#94a3b8"/>
  <rect x="730" y="330" width="410" height="170" rx="26" fill="#ffffff" stroke="#0ea5a4" stroke-width="6"/>
  <text x="935" y="435" text-anchor="middle" font-size="56" font-weight="800" fill="#0f172a">두드러기</text>

  <!-- 3행: 눌러도 남나 → 바로 진료 -->
  <rect x="60" y="560" width="540" height="170" rx="26" fill="#fef2f2" stroke="#ef4444" stroke-width="6"/>
  <text x="330" y="665" text-anchor="middle" font-size="52" font-weight="800" fill="#ef4444">눌러도 남음?</text>
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none"><line x1="620" y1="645" x2="690" y2="645"/></g>
  <polygon points="712,645 682,629 682,661" fill="#94a3b8"/>
  <rect x="730" y="560" width="410" height="170" rx="26" fill="#fef2f2" stroke="#ef4444" stroke-width="6"/>
  <text x="935" y="665" text-anchor="middle" font-size="56" font-weight="800" fill="#ef4444">바로 진료</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
