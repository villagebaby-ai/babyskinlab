<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 연결선 -->
  <g fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <path d="M600 168 L600 232"/>
    <path d="M470 300 L300 300 L300 452"/>
    <path d="M730 300 L900 300 L900 452"/>
  </g>
  <!-- 화살표 촉 -->
  <g fill="#cbd5e1">
    <path d="M600 236 l-13 -22 h26 Z"/>
    <path d="M300 456 l-13 -22 h26 Z"/>
    <path d="M900 456 l-13 -22 h26 Z"/>
  </g>

  <!-- 시작 -->
  <rect x="400" y="70" width="400" height="98" rx="26" fill="#e6f7f7"/>
  <text x="600" y="135" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">손발 벗겨짐</text>

  <!-- 판단 -->
  <rect x="360" y="232" width="480" height="100" rx="50" fill="#ffffff" stroke="#0ea5a4" stroke-width="6"/>
  <text x="600" y="298" text-anchor="middle" font-size="50" font-weight="800" fill="#0b8483">붉거나 가려움?</text>

  <!-- 분기 라벨 -->
  <text x="360" y="392" text-anchor="middle" font-size="44" font-weight="700" fill="#64748b">아니오</text>
  <text x="840" y="392" text-anchor="middle" font-size="44" font-weight="700" fill="#ef4444">예</text>

  <!-- 좌: 보습 -->
  <rect x="150" y="456" width="300" height="110" rx="26" fill="#e6f7f7"/>
  <text x="300" y="527" text-anchor="middle" font-size="54" font-weight="800" fill="#0b8483">보습</text>

  <!-- 우: 진료 상담 -->
  <rect x="750" y="456" width="300" height="110" rx="26" fill="#fde4e4"/>
  <text x="900" y="527" text-anchor="middle" font-size="52" font-weight="800" fill="#ef4444">진료 상담</text>

  <!-- 하단 경고 배너 -->
  <rect x="230" y="650" width="740" height="110" rx="26" fill="#fee2e2" stroke="#ef4444" stroke-width="5"/>
  <text x="600" y="720" text-anchor="middle" font-size="48" font-weight="800" fill="#ef4444">열 나면 바로 진료</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
