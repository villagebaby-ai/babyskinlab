<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 좌: 건조성 각질 카드 -->
  <rect x="90" y="150" width="470" height="520" rx="32" fill="#e6f7f7"/>
  <text x="325" y="270" text-anchor="middle" font-size="92" font-weight="800" fill="#0b8483">각질</text>
  <!-- 피부 스와치 + 하얀 각질 조각 -->
  <rect x="185" y="320" width="280" height="150" rx="26" fill="#ffffff" stroke="#0ea5a4" stroke-width="6"/>
  <g fill="#ffffff" stroke="#0ea5a4" stroke-width="5" stroke-linejoin="round">
    <rect x="230" y="360" width="46" height="30" rx="8" transform="rotate(-12 253 375)"/>
    <rect x="315" y="345" width="52" height="32" rx="8" transform="rotate(9 341 361)"/>
    <rect x="300" y="410" width="48" height="30" rx="8" transform="rotate(-6 324 425)"/>
    <rect x="380" y="405" width="44" height="28" rx="8" transform="rotate(14 402 419)"/>
  </g>
  <text x="325" y="560" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">하얀 각질</text>
  <text x="325" y="622" text-anchor="middle" font-size="46" font-weight="700" fill="#64748b">덜 가려움</text>

  <!-- 우: 습진 카드 -->
  <rect x="640" y="150" width="470" height="520" rx="32" fill="#fde4e4"/>
  <text x="875" y="270" text-anchor="middle" font-size="92" font-weight="800" fill="#ef4444">습진</text>
  <!-- 붉은 피부 스와치 + 진물/좁쌀 점 -->
  <rect x="735" y="320" width="280" height="150" rx="26" fill="#fca5a5" stroke="#ef4444" stroke-width="6"/>
  <g fill="#ef4444">
    <circle cx="800" cy="365" r="12"/>
    <circle cx="875" cy="400" r="14"/>
    <circle cx="945" cy="360" r="11"/>
    <circle cx="835" cy="430" r="10"/>
    <circle cx="925" cy="425" r="12"/>
  </g>
  <text x="875" y="560" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">붉고 진물</text>
  <text x="875" y="622" text-anchor="middle" font-size="46" font-weight="700" fill="#ef4444">많이 가려움</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
