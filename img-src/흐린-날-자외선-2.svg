<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 시작 : 자외선지수 확인 -->
  <rect x="400" y="40" width="400" height="100" rx="24" fill="#e6f7f7" stroke="#0b8483" stroke-width="6"/>
  <text x="600" y="107" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a">자외선지수</text>

  <!-- 분기 커넥터 -->
  <g fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 140 V176 H270 V206"/>
    <path d="M600 176 H930 V206"/>
    <path d="M258 194 l12 14 l12 -14"/>
    <path d="M918 194 l12 14 l12 -14"/>
  </g>

  <!-- 왼쪽 : 3 미만 -->
  <rect x="90" y="212" width="360" height="96" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="6"/>
  <text x="270" y="276" text-anchor="middle" font-size="52" font-weight="800" fill="#64748b">3 미만</text>

  <g fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 308 V356"/>
    <path d="M258 344 l12 14 l12 -14"/>
  </g>

  <rect x="90" y="364" width="360" height="96" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="6"/>
  <text x="270" y="428" text-anchor="middle" font-size="50" font-weight="700" fill="#64748b">평소대로</text>

  <!-- 오른쪽 : 3 이상 -->
  <rect x="750" y="212" width="360" height="96" rx="24" fill="#0ea5a4"/>
  <text x="930" y="276" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff">3 이상</text>

  <!-- 월령 분기 커넥터 -->
  <g fill="none" stroke="#0b8483" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M930 308 V340 H578 V620"/>
    <path d="M578 440 H614"/>
    <path d="M578 620 H614"/>
    <path d="M602 428 l14 12 l-14 12"/>
    <path d="M602 608 l14 12 l-14 12"/>
  </g>

  <!-- 6개월 미만 -->
  <rect x="622" y="366" width="488" height="150" rx="24" fill="#e6f7f7" stroke="#0b8483" stroke-width="5"/>
  <text x="866" y="426" text-anchor="middle" font-size="46" font-weight="800" fill="#0b8483">6개월 미만</text>
  <text x="866" y="484" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">그늘·옷·모자</text>

  <!-- 6개월 이상 -->
  <rect x="622" y="546" width="488" height="150" rx="24" fill="#e6f7f7" stroke="#0b8483" stroke-width="5"/>
  <text x="866" y="606" text-anchor="middle" font-size="46" font-weight="800" fill="#0b8483">6개월 이상</text>
  <text x="866" y="664" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">옷·선크림</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
</svg>
