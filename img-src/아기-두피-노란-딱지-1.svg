  </g>

  <text x="300" y="706" text-anchor="middle" font-size="44" font-weight="600" fill="#64748b">낱개로 탈락</text>

  <!-- 우 : 두피 표면 + 피지 층 -->
  <rect x="640" y="600" width="400" height="40" rx="14" fill="#0b8483"/>
  <rect x="640" y="536" width="400" height="64" rx="16" fill="#fef3c7"/>
  <text x="1058" y="584" font-size="44" fill="#64748b">피지</text>

  <!-- 우 : 겹쳐 붙어 한 덩어리가 된 각질 -->
  <g fill="#e6f7f7" stroke="#0b8483" stroke-width="5">
    <rect x="645" y="508" width="76" height="44" rx="6" transform="rotate(-3 683 530)"/>
    <rect x="697" y="508" width="76" height="44" rx="6" transform="rotate(4 735 530)"/>
    <rect x="749" y="508" width="76" height="44" rx="6" transform="rotate(-2 787 530)"/>
    <rect x="801" y="508" width="76" height="44" rx="6" transform="rotate(3 839 530)"/>
    <rect x="853" y="508" width="76" height="44" rx="6" transform="rotate(-4 891 530)"/>
    <rect x="905" y="508" width="76" height="44" rx="6" transform="rotate(2 943 530)"/>
    <rect x="957" y="508" width="76" height="44" rx="6" transform="rotate(-3 995 530)"/>
    <rect x="671" y="474" width="76" height="44" rx="6" transform="rotate(3 709 496)"/>
    <rect x="723" y="474" width="76" height="44" rx="6" transform="rotate(-3 761 496)"/>
    <rect x="775" y="474" width="76" height="44" rx="6" transform="rotate(2 813 496)"/>
    <rect x="827" y="474" width="76" height="44" rx="6" transform="rotate(-4 865 496)"/>
    <rect x="879" y="474" width="76" height="44" rx="6" transform="rotate(3 917 496)"/>
    <rect x="931" y="474" width="76" height="44" rx="6" transform="rotate(-2 969 496)"/>
    <rect x="723" y="440" width="76" height="44" rx="6" transform="rotate(-4 761 462)"/>
    <rect x="775" y="440" width="76" height="44" rx="6" transform="rotate(3 813 462)"/>
    <rect x="827" y="440" width="76" height="44" rx="6" transform="rotate(-3 865 462)"/>
    <rect x="879" y="440" width="76" height="44" rx="6" transform="rotate(4 917 462)"/>
