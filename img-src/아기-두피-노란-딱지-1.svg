<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- 좌우 패널 구분선 -->
  <line x1="590" y1="130" x2="590" y2="700" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 패널 라벨 -->
  <text x="300" y="112" text-anchor="middle" font-size="54" font-weight="700" fill="#0f172a">정상 두피</text>
  <text x="840" y="112" text-anchor="middle" font-size="54" font-weight="700" fill="#0f172a">지루성 두피</text>

  <!-- 좌 : 두피 표면 -->
  <rect x="100" y="600" width="400" height="40" rx="14" fill="#0b8483"/>

  <!-- 좌 : 낱개로 흩어져 떠오르는 각질 -->
  <g fill="#e6f7f7" stroke="#0b8483" stroke-width="5">
    <rect x="136" y="524" width="76" height="44" rx="6" transform="rotate(-7 174 546)"/>
    <rect x="262" y="540" width="76" height="44" rx="6" transform="rotate(9 300 562)"/>
