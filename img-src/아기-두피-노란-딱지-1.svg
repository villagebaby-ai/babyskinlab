  <text x="840" y="706" text-anchor="middle" font-size="44" font-weight="600" fill="#0b8483">뭉쳐서 딱지</text>

  <text x="1180" y="784" text-anchor="end" font-size="20" fill="#cbd5e1">babyskinlab.com</text>
